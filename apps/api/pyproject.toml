[project]
name = "thirdeye"
version = "0.1.0"
description = "Self-hosted, open-source OSINT globe for exploring public open-data feeds on a 3D map."
readme = "README.md"
license = "MIT"
authors = [
    { name = "SolaimanK05", email = "solaimankalam05@gmail.com" }
]

requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[project.scripts]
thirdeye = "thirdeye:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
